global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/postgresql-rules.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cpq-demo
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: cpq-demo
          environment: demo
          source: direct-application

  - job_name: postgresql
    scrape_interval: 30s
    scrape_timeout: 8s
    static_configs:
      - targets:
          - workspace-monitor-postgresql-exporter.default.svc.cluster.local:9187
        labels:
          instance: cpq-demo-postgresql
          service: cpq-demo
          environment: demo
          dependency: postgresql
          source: postgresql-exporter
      - targets:
          - workspace-monitor-postgresql-exporter.cpq-test.svc.cluster.local:9187
        labels:
          instance: cpq-test-postgresql
          service: cpq-test
          environment: test
          dependency: postgresql
          source: postgresql-exporter
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "pg_up|pg_exporter_last_scrape_error|pg_exporter_last_scrape_duration_seconds|pg_database_size_bytes|pg_locks_count|pg_long_running_transactions|pg_long_running_transactions_oldest_timestamp_seconds|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_database_xact_commit|pg_stat_database_xact_rollback|pg_stat_database_deadlocks|pg_workspace_waiting_connections_count"
        action: keep
      - source_labels: [datname]
        regex: "|cpq"
        action: keep
      - regex: "datid|datname|server|usename|application_name|wait_event"
        action: labeldrop

  - job_name: portfolio-nginx
    static_configs:
      - targets:
          - public-website-metrics.public-site.svc.cluster.local:9113
        labels:
          service: portfolio
          environment: portfolio
          source: nginx-exporter

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: cpq-lab-host
          environment: lab

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: docker-containers
          environment: lab

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: gatus-internal
    static_configs:
      - targets:
          - gatus-internal:8080
        labels:
          vantage: internal

  - job_name: gatus-public-path
    static_configs:
      - targets:
          - gatus-public-path:8080
        labels:
          vantage: public-path-simulation
