services:
  portal:
    build:
      context: ../../..
      dockerfile: deploy/portal/Dockerfile
      args:
        PORTAL_BUILD_REVISION: ${PORTAL_BUILD_REVISION:-development}
    image: "workspace-monitor-portal:${PORTAL_BUILD_REVISION:-development}"
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:3100:8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=4m,mode=0755,uid=101,gid=101
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '^healthy$'"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    labels:
      org.opencontainers.image.revision: ${PORTAL_BUILD_REVISION:-development}
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - inventory-api

  inventory-api:
    build:
      context: ../../..
      dockerfile: deploy/inventory-api/Dockerfile
      args:
        PORTAL_BUILD_REVISION: ${PORTAL_BUILD_REVISION:-development}
    image: "workspace-monitor-inventory-api:${PORTAL_BUILD_REVISION:-development}"
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INVENTORY_PORT: "3001"
      CATALOG_PATH: /app/catalog/services.json
      UPSTREAM_TIMEOUT_MS: "3000"
      SOURCE_STALE_AFTER_SECONDS: "180"
      KUBERNETES_API_URL: ${KUBERNETES_API_URL:-https://host.docker.internal:6443}
      KUBERNETES_TOKEN_FILE: /run/secrets/kubernetes_inventory_token
      KUBERNETES_TOOL_URL: "#kubernetes-api-no-browser-link"
      NODE_EXTRA_CA_CERTS: /run/kubernetes-ca/server-ca.crt
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${MONITORING_DATA_DIR}/runtime-secrets:/run/secrets:ro
      - ${KUBERNETES_HOST_CA_FILE:-/var/lib/rancher/k3s/server/tls/server-ca.crt}:/run/kubernetes-ca/server-ca.crt:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    labels:
      org.opencontainers.image.revision: ${PORTAL_BUILD_REVISION:-development}
    mem_limit: 128m
    cpus: 0.25

  prometheus:
    image: prom/prometheus:v3.13.1-distroless
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=25GB
      - --web.enable-lifecycle
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 2g
    cpus: 1.0

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    user: "472:0"
    group_add:
      - "${MONITORING_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - prometheus
    environment:
      GF_SERVER_DOMAIN: ${MONITORING_PUBLIC_HOST}
      GF_SERVER_ROOT_URL: ${MONITORING_PUBLIC_URL}
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/log/grafana:size=32m,mode=0755,uid=472,gid=0
    mem_limit: 512m
    cpus: 0.5

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/blackbox-exporter/blackbox.yaml
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9115:9115"
    volumes:
      - ./config/blackbox.yaml:/etc/blackbox-exporter/blackbox.yaml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.2

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 128m
    cpus: 0.2

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    restart: unless-stopped
    privileged: true
    read_only: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    cpus: 0.4

  gatus-internal:
    image: ghcr.io/twin/gatus:v5.34.0
    restart: unless-stopped
    user: "${MONITORING_UID}:${MONITORING_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - "${MONITORING_ENV_FILE:-.env}"
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:8085:8080"
    volumes:
      - ../../../probes/internal/config.yaml:/config/config.yaml:ro
      - ${MONITORING_DATA_DIR}/gatus-internal:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.2

  gatus-public-path:
    image: ghcr.io/twin/gatus:v5.34.0
    restart: unless-stopped
    user: "${MONITORING_UID}:${MONITORING_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - "${MONITORING_ENV_FILE:-.env}"
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:8186:8080"
    volumes:
      - ./config/gatus-public-path.yaml:/config/config.yaml:ro
      - ${MONITORING_DATA_DIR}/gatus-public-path:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.2

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE}

volumes:
  prometheus-data:
  grafana-data:
