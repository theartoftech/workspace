map $uri $portal_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    add_header Cache-Control $portal_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        proxy_pass http://inventory-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location /auth/ {
        proxy_pass http://inventory-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location = /_auth/check {
        internal;
        proxy_pass http://inventory-api:3001/api/v1/auth-check;
        proxy_pass_request_body off;
        proxy_method GET;
        proxy_set_header Content-Length "";
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location /tools/gatus-internal/ {
        auth_request /_auth/check;
        proxy_pass http://gatus-internal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 8s;
    }

    location /tools/gatus-public-path/ {
        auth_request /_auth/check;
        proxy_pass http://gatus-public-path:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 8s;
    }

    location / {
        auth_request /_auth/check;
        try_files $uri $uri/ /index.html;
    }
}
